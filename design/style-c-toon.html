<title>Fab 7 卡通渲染劇場</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap');
:root{
  --ink:#0a0a0a; --paper:#fffdf4; --red:#e60012; --yellow:#ffd400; --grey:#d9d6cc;
  --f-body:"LXGW WenKai TC","Noto Serif TC","Microsoft JhengHei","PingFang TC","Heiti TC","Noto Sans CJK TC",sans-serif;
  --f-head:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC","Noto Sans CJK TC",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{background:#1a0407;color:#0a0a0a;font-family:var(--f-body);font-size:16px;overflow:hidden;position:relative}
[hidden]{display:none!important}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;background:#1a0407}
#scene.drag{cursor:grabbing}

/* ---------- 全畫面漫畫特效 ---------- */
.fx{position:fixed;inset:0;pointer-events:none}
.fx-speed{background:repeating-conic-gradient(from 0deg at 36% 46%,rgba(0,0,0,.9) 0 .5deg,transparent .5deg 4.2deg);
  -webkit-mask-image:radial-gradient(circle at 36% 46%,transparent 38%,#000 92%);mask-image:radial-gradient(circle at 36% 46%,transparent 38%,#000 92%);opacity:.42}
.fx-dots{background:radial-gradient(circle,#000 28%,transparent 31%) 0 0/7px 7px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 45%,transparent 45%,#000 100%);mask-image:radial-gradient(ellipse at 50% 45%,transparent 45%,#000 100%);opacity:.38}
.fx-alert{background:radial-gradient(ellipse at 50% 50%,rgba(230,0,18,0) 40%,rgba(230,0,18,.5) 100%);animation:alert 1.2s steps(2,end) infinite}
@keyframes alert{0%{opacity:.35}50%{opacity:1}100%{opacity:.35}}
.sfx{position:fixed;left:47%;top:13%;z-index:2;pointer-events:none;font-family:var(--f-head);font-weight:900;font-size:clamp(28px,6vw,70px);
  color:var(--yellow);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;transform:rotate(-9deg);letter-spacing:.04em;text-shadow:5px 5px 0 var(--red);animation:shake .5s steps(2,end) infinite}
.sfx small{display:block;font-size:.34em;color:var(--paper);-webkit-text-stroke:5px var(--ink);text-shadow:3px 3px 0 var(--red);margin-top:2px;letter-spacing:.12em}
@keyframes shake{0%{transform:rotate(-9deg) translate(0,0)}50%{transform:rotate(-8deg) translate(3px,-2px)}100%{transform:rotate(-9deg) translate(0,0)}}

/* ---------- UI 殼 ---------- */
#ui{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:space-between;gap:12px;pointer-events:none;
  padding:max(16px,env(safe-area-inset-top)) 16px max(30px,calc(env(safe-area-inset-bottom) + 24px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hudcol{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.panel{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:6px 14px 8px 12px/12px 6px 14px 8px;box-shadow:6px 6px 0 var(--ink);pointer-events:auto}
.panel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle,rgba(10,10,10,.5) 1.1px,transparent 1.6px) 0 0/6px 6px;
  -webkit-mask-image:linear-gradient(to top left,#000,transparent 42%);mask-image:linear-gradient(to top left,#000,transparent 42%)}
.panel>*{position:relative;z-index:1}

.hud{padding:8px 14px 8px;transform:rotate(-1.2deg)}
.hud .date{font-family:var(--f-head);font-weight:700;font-size:clamp(13px,1.5vw,16px)}
.hud .clock{font-family:var(--f-head);font-weight:900;font-size:clamp(26px,3.4vw,38px);line-height:1;margin-left:6px;background:var(--ink);color:var(--yellow);padding:0 8px;display:inline-block;transform:skew(-8deg)}
.hud .day{font-family:var(--f-head);font-weight:900;font-size:clamp(15px,1.8vw,19px);color:var(--red);margin-top:2px}
.rank{background:var(--ink);color:var(--paper);font-family:var(--f-head);font-weight:900;font-size:clamp(14px,1.6vw,18px);padding:6px 14px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--red);transform:rotate(.8deg);pointer-events:auto}
.rank small{display:block;font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--yellow)}

.stats{width:min(310px,100%);padding:30px 14px 12px;transform:rotate(.7deg)}
.stats h2{position:absolute;z-index:2;left:-8px;top:-14px;margin:0;background:var(--red);color:var(--paper);font-family:var(--f-head);font-weight:900;font-size:15px;letter-spacing:.15em;padding:3px 12px;border:3px solid var(--ink);transform:rotate(-3deg);box-shadow:3px 3px 0 var(--ink)}
.stat-grid{display:grid;gap:8px 0}
.row,.talk,.choice,.stats{min-width:0}
.row{position:relative;display:grid;grid-template-columns:5.2em 1fr auto;align-items:center;gap:8px}
.row .lab{font-family:var(--f-head);font-weight:900;font-size:14px;white-space:nowrap}
.bar{height:15px;border:3px solid var(--ink);background:repeating-linear-gradient(135deg,#fff 0 4px,var(--grey) 4px 6px);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink)}
.row.low .bar i{background:repeating-linear-gradient(135deg,var(--red) 0 5px,#9d000d 5px 8px)}
.row.low .lab::after{content:"危";margin-left:3px;font-size:10px;background:var(--red);color:#fff;padding:0 3px;border-radius:2px;vertical-align:2px}
.num{font-family:var(--f-head);font-weight:900;font-size:17px;min-width:3.6em;text-align:right;white-space:nowrap}
.num small{font-size:11px;font-weight:700;opacity:.7}
.coins{display:flex;gap:4px;grid-column:2/4;justify-content:flex-start;align-items:center}
.coin{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);box-shadow:inset -3px -3px 0 rgba(10,10,10,.28)}
.coin.off{background:#fff;box-shadow:none;border-style:dashed}
.coins b{font-family:var(--f-head);font-weight:900;font-size:17px;margin-left:6px}
.coin.pop{animation:pop .5s steps(3,end)}
@keyframes pop{0%{transform:scale(1.7) rotate(-20deg)}100%{transform:none}}
.money{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:3px dashed var(--ink);padding-top:6px;margin-top:2px}
.money .num{font-size:22px}
.delta{position:absolute;right:0;top:-14px;font-family:var(--f-head);font-weight:900;font-size:20px;color:var(--paper);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;animation:float 1.7s steps(10,end) forwards;pointer-events:none;z-index:4}
.delta.neg{color:var(--red)}
.delta.pos{color:var(--yellow)}
@keyframes float{0%{transform:translateY(8px) scale(1.5);opacity:0}15%{opacity:1}100%{transform:translateY(-14px) scale(1);opacity:0}}

/* ---------- 對話區 ---------- */
.dialog{display:grid;grid-template-columns:230px 1fr;grid-template-areas:"p t" "p c";column-gap:20px;row-gap:12px;width:100%;max-width:1080px;margin:0 auto;align-items:start;max-height:62%;overflow-y:auto;overflow-x:hidden;padding:0 8px 8px 0;pointer-events:none}
.portrait{grid-area:p;align-self:end;position:relative;pointer-events:auto;margin-top:-30px}
.portrait::before{content:"";position:absolute;inset:6px 0 24px;border:4px solid var(--ink);border-radius:6px;background:repeating-conic-gradient(from 0deg at 50% 62%,var(--red) 0 4deg,var(--paper) 4deg 9deg);box-shadow:6px 6px 0 var(--ink)}
.portrait svg{position:relative;display:block;width:100%;height:auto;max-height:300px;filter:drop-shadow(0 0 0 #000)}
.portrait .nameplate{position:absolute;left:-6px;bottom:6px;background:var(--ink);color:var(--paper);font-family:var(--f-head);font-weight:900;font-size:17px;padding:3px 12px;letter-spacing:.12em;border:3px solid var(--paper);transform:rotate(-3deg);box-shadow:3px 3px 0 var(--red)}
.portrait .sourg{display:none}
.portrait.sour .smileg{display:none}
.portrait.sour .sourg{display:inline}

.talk{grid-area:t;padding:26px 22px 16px;border-radius:30px 12px 28px 10px/14px 26px 12px 28px;pointer-events:auto}
.talk::before{content:"";position:absolute;z-index:2;left:-14px;top:46px;width:22px;height:22px;background:var(--paper);border-left:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg)}
.talk .speaker{position:absolute;z-index:3;left:18px;top:-17px;background:var(--ink);color:var(--yellow);font-family:var(--f-head);font-weight:900;font-size:17px;padding:2px 16px;border:3px solid var(--ink);transform:skew(-8deg);letter-spacing:.1em}
.talk p{margin:0;font-size:clamp(17px,1.9vw,21px);line-height:1.65;font-weight:700}
.talk.result{border-radius:4px;background:#fff;border-style:double;border-width:7px}
.talk.result::before{display:none}
.talk.result .speaker{background:var(--red);color:var(--paper)}
.talk .after{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-head);font-weight:900;font-size:13px;padding:2px 8px;border:3px solid var(--ink);border-radius:3px;white-space:nowrap;line-height:1.35}
.chip.neg{background:var(--red);color:var(--paper)}
.chip.pos{background:var(--ink);color:var(--yellow)}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--yellow);outline-offset:3px;box-shadow:0 0 0 8px var(--ink)}
.reset{font-family:var(--f-head);font-weight:900;font-size:17px;background:var(--yellow);border:4px solid var(--ink);padding:6px 20px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transform:rotate(-1.5deg)}
.reset:hover{background:var(--red);color:var(--paper)}
.reset:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}

.choices{grid-area:c;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;pointer-events:none}
.choice{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;background:var(--paper);border:5px solid var(--ink);padding:14px 14px 12px;box-shadow:6px 6px 0 var(--ink);pointer-events:auto;min-height:118px;overflow:hidden;transition:transform .12s steps(2,end)}
.choice:nth-child(1){transform:rotate(-.9deg)}
.choice:nth-child(2){transform:rotate(.5deg) translateY(3px)}
.choice:nth-child(3){transform:rotate(-.4deg)}
.choice::before{content:"";position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(10,10,10,.8) 1.6px,transparent 2.2px) 0 0/7px 7px;opacity:.5}
.choice:hover{background:var(--yellow);transform:translate(-3px,-4px) rotate(0);box-shadow:10px 10px 0 var(--ink)}
.choice:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.choice>*{position:relative}
.choice .idx{position:absolute;right:-4px;top:-8px;font-family:var(--f-head);font-weight:900;font-size:34px;line-height:1;color:var(--red);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.choice .ttl{font-family:var(--f-head);font-weight:900;font-size:clamp(17px,1.8vw,21px);line-height:1.25;padding-right:34px}
.choice .chips{margin-top:auto}

.styletag{position:fixed;right:16px;bottom:6px;z-index:5;font-family:var(--f-head);font-weight:900;font-size:11px;letter-spacing:.12em;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);padding:0 8px;line-height:16px;pointer-events:none}

/* ---------- 手機 ---------- */
@media (max-width:760px){
  #ui{gap:8px;padding-bottom:max(30px,calc(env(safe-area-inset-bottom) + 24px))}
  .top{flex-direction:column;gap:8px;align-items:stretch}
  .hudcol{flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:8px 10px}
  .hud{padding:5px 10px}
  .hud .clock{font-size:22px}
  .rank{padding:4px 10px;font-size:13px}
  .stats{width:100%;padding:24px 12px 10px;transform:none}
  .stat-grid{grid-template-columns:1fr 1fr;gap:8px 16px}
  .row{grid-template-columns:3.6em 1fr;gap:2px 6px}
  .row .lab{font-size:12px}
  .row .num{grid-column:1/3;text-align:left;font-size:14px;min-width:0;margin-top:-4px}
  .bar{height:11px;border-width:2px}
  .coins{grid-column:1/3}
  .money{grid-column:1/3}
  .money .num{font-size:18px;grid-column:auto;margin:0}
  .sfx{left:14%;top:30%;-webkit-text-stroke:6px var(--ink)}
  .dialog{grid-template-columns:84px 1fr;grid-template-areas:"p t" "c c";column-gap:12px;max-height:68%}
  .portrait{margin-top:0;height:110px;overflow:hidden;align-self:start}
  .portrait svg{height:120px;width:100%}
  .portrait .nameplate{font-size:12px;padding:1px 6px}
  .talk{padding:20px 14px 12px}
  .talk p{font-size:15px;line-height:1.55}
  .choices{grid-template-columns:minmax(0,1fr);gap:12px}
  .dialog{min-width:0}
  .stat-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .choice{min-height:0;padding:10px 12px;box-shadow:4px 4px 0 var(--ink)}
  .choice:nth-child(n){transform:none}
  .choice .ttl{font-size:16px}
  .styletag{right:16px}
}
@media (max-width:760px) and (max-height:700px){.sfx{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .fx-alert{opacity:.7}
}
</style>

  });

  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  var viewShift = 0.1;
  function resize() {
    var w = window.innerWidth, h = window.innerHeight, aspect = w / h;
    renderer.setSize(w, h, false);
    var v = 2 * Math.atan(Math.tan(32 * Math.PI / 180) / aspect) * 180 / Math.PI;
    camera.fov = Math.max(54, Math.min(84, v));
    camera.aspect = aspect;
    viewShift = w < 760 ? 0.2 : 0.12;
    camera.setViewOffset(w, h, 0, h * viewShift, w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  var Y_AXIS = new THREE.Vector3(0, 1, 0), off = new THREE.Vector3();
  var clock = new THREE.Clock();
  function frame() {
    var t = reduce ? 0 : clock.getElapsedTime();
    yaw += (yawT - yaw) * 0.08; pitch += (pitchT - pitch) * 0.08;
    off.copy(BASE).sub(TARGET).applyAxisAngle(Y_AXIS, yaw + Math.sin(t * 0.3) * 0.02);
    camera.position.set(TARGET.x + off.x, BASE.y + pitch * 5 + Math.sin(t * 0.5) * 0.03, TARGET.z + off.z);
    var roll = 0.11 + Math.sin(t * 0.4) * 0.008;
    camera.up.set(Math.sin(roll), Math.cos(roll), 0);
    camera.lookAt(TARGET);

    oht.position.z = reduce ? -2 : 8 - ((t * 2.6) % 44);

    var blinkOn = reduce ? true : (t * 1.7) % 1 < 0.5;
    if (redDown) {
      redDown.lamp.material = blinkOn ? redDown.on : redDown.off;
      redDown.screen.material.map = blinkOn ? redDown.a : redDown.b;
    }
    redLight.intensity = blinkOn ? 3.2 : 1.1;
    yellowLight.intensity = 2.3 + Math.sin(t * 2) * 0.15;
    hero.position.y = Math.sin(t * 1.6) * 0.012;
    head.rotation.x = 0.28 + Math.sin(t * 1.1) * 0.04;

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
